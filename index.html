<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0f">
    <title>Almacén | SIS101</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/app.css">
  </head>
  <body>
    <section class="login-screen" id="login-screen">
      <form class="login-card" id="login-form">
        <span class="brand-mark">A</span>
        <p class="eyebrow">SIS101 · ALMACÉN</p>
        <h1>Iniciar sesión</h1>
        <p class="page-subtitle">Ingresa con la cuenta asignada por el administrador.</p>
        <div class="form-field"><label for="login-username">Usuario</label><input class="field" id="login-username" name="usuario" autocomplete="username" minlength="3" maxlength="32" required></div>
        <div class="form-field"><label for="login-password">Contraseña</label><input class="field" id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required></div>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="button button-primary login-submit" type="submit">Entrar</button>
      </form>
    </section>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="Almacén, inicio">
          <span class="brand-mark">A</span>
          <span class="brand-copy"><strong>almacén</strong><small>CONTROL DE INVENTARIO</small></span>
        </a>

        <div class="nav-label">GESTIÓN</div>
        <nav class="main-nav" aria-label="Navegación principal">
          <button class="nav-item active admin-only" data-view="dashboard"><span class="nav-icon">◫</span>Resumen</button>
          <button class="nav-item" data-view="productos"><span class="nav-icon">▤</span>Productos<span class="nav-count" id="nav-product-count">0</span></button>
          <button class="nav-item" data-view="combos"><span class="nav-icon">▦</span>Combos<span class="nav-count" id="nav-combo-count">0</span></button>
          <button class="nav-item employee-only" data-view="ventas"><span class="nav-icon">↗</span>Ventas</button>
          <button class="nav-item" data-view="historial"><span class="nav-icon">▤</span>Historial</button>
          <button class="nav-item admin-only" data-view="usuarios"><span class="nav-icon">♙</span>Cuentas</button>
        </nav>

        <div class="admin-only">
          <div class="nav-label nav-label-spaced">CONFIGURACIÓN</div>
          <nav class="main-nav" aria-label="Configuración">
            <button class="nav-item" data-view="categorias"><span class="nav-icon">▧</span>Categorías</button>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <div class="storage-indicator"><span class="status-dot"></span><span id="storage-label">Datos guardados en este dispositivo</span></div>
          <button class="sidebar-action admin-only" id="export-data"><span>↓</span> Exportar respaldo</button>
          <button class="sidebar-action" id="change-password"><span>⚿</span> Cambiar contraseña</button>
          <button class="sidebar-action" id="logout-button"><span>↪</span> Cerrar sesión</button>
          <div class="user-chip"><span class="user-avatar" id="user-avatar">S</span><span><strong id="user-name">SIS101</strong><small id="user-role">Administración</small></span></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menú">☰</button>
          <div class="breadcrumb"><span>Almacén</span><span class="crumb-separator">/</span><strong id="current-section">Resumen</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="button button-primary button-small admin-only" data-action="add-product"><span class="button-plus">+</span> Nuevo producto</button>
          </div>
        </header>

        <div class="page-content" id="page-content"></div>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <div><p class="eyebrow" id="modal-eyebrow">ALMACÉN</p><h2 id="modal-title"></h2></div>
          <button class="icon-button" id="modal-close" aria-label="Cerrar">×</button>
        </header>
        <div class="modal-body" id="modal-body"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="src/js/Blu.js"></script>
    <script src="node_modules/qrcode-generator/dist/qrcode.js"></script>
    <script src="src/js/app.js"></script>
  </body>
</html>
