    <style>
:root {
  color-scheme: dark;
  --ink: #f5f5f5;
  --muted: #969eae;
  --line: #252a35;
  --paper: #11141b;
  --canvas: #0b0b0f;
  --green: #1e5eff;
  --green-dark: #090b11;
  --green-soft: #172343;
  --lime: #c0c0c0;
  --amber: #302919;
  --amber-ink: #e3b963;
  --red: #ff777f;
  --red-soft: #301a20;
  --shadow: 0 22px 60px rgba(0, 0, 0, .42);
  font-family: "Inter", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); }
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(57, 123, 94, .25); outline-offset: 2px; }
.app-shell { min-height: 100vh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; flex-direction: column;
  width: 248px; padding: 27px 16px 16px; background: var(--green-dark); color: #f1f5ed;
}
.brand { display: flex; align-items: center; gap: 11px; margin: 0 7px 44px; color: inherit; text-decoration: none; }
.brand-mark { display: grid; width: 37px; aspect-ratio: 1; place-items: center; border-radius: 11px; background: var(--lime); color: var(--green-dark); font: 800 21px "Inter", sans-serif; }
.brand-copy { display: grid; gap: 2px; }
.brand-copy strong { font: 800 19px "Inter", sans-serif; letter-spacing: 0; }
.brand-copy small { color: #a7b9ae; font-size: 9px; font-weight: 700; letter-spacing: 1.1px; }
.nav-label { padding: 0 12px; color: #91a99a; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
.nav-label-spaced { margin-top: 30px; }
.main-nav { display: grid; gap: 5px; margin-top: 11px; }
.nav-item { display: flex; align-items: center; gap: 12px; min-height: 43px; width: 100%; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: #c4d2c8; cursor: pointer; text-align: left; font-size: 13px; font-weight: 600; }
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: #315d4c; color: #fff; }
.nav-icon { display: grid; width: 20px; place-items: center; color: #b6d2bd; font-size: 18px; }
.nav-count { margin-left: auto; color: #a7b9ae; font-size: 11px; font-variant-numeric: tabular-nums; }
.sidebar-bottom { margin-top: auto; }
.storage-indicator { display: flex; gap: 8px; align-items: center; padding: 11px 9px; color: #a7b9ae; font-size: 10px; line-height: 1.4; }
.status-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: #9cce84; box-shadow: 0 0 0 3px rgba(156, 206, 132, .12); }
.sidebar-action { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 10px; border: 1px solid rgba(255,255,255,.13); border-radius: 6px; background: transparent; color: #e0e9e1; cursor: pointer; font-size: 12px; font-weight: 600; }
.sidebar-action:hover { background: rgba(255,255,255,.07); }
.sidebar-action span { font-size: 17px; }
.user-chip { display: flex; align-items: center; gap: 10px; margin-top: 19px; padding: 15px 3px 1px; border-top: 1px solid rgba(255,255,255,.12); }
.user-avatar { display: grid; width: 32px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: #e4a77d; color: #442b20; font-size: 13px; font-weight: 700; }
.user-chip > span:last-child { display: grid; gap: 2px; }
.user-chip strong { font-size: 11px; }
.user-chip small { color: #a7b9ae; font-size: 10px; }

.main-area { min-height: 100vh; margin-left: 248px; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; height: 66px; padding: 0 42px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92); backdrop-filter: blur(12px); }
.breadcrumb { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.breadcrumb strong { color: var(--ink); font-weight: 700; }
.crumb-separator { color: #bbc2bc; }
.topbar-actions { display: flex; align-items: center; gap: 18px; }
.today-label { color: var(--muted); font-size: 11px; text-transform: capitalize; }
.mobile-menu { display: none; }
.page-content { max-width: 1440px; margin: 0 auto; padding: 36px 42px 54px; }
.page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 27px; }
.eyebrow { margin: 0 0 8px; color: var(--green); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 6px; font: 800 28px "Inter", sans-serif; letter-spacing: 0; }
.page-subtitle { margin: 0; color: var(--muted); font-size: 13px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 0 14px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; transition: background .16s ease, transform .16s ease; }
.button:hover { transform: translateY(-1px); }
.button-primary { background: var(--green); color: #fff; }
.button-primary:hover { background: #1d4b3b; }
.button-secondary { border-color: var(--line); background: var(--paper); color: var(--ink); }
.button-secondary:hover { background: #f8faf7; }
.button-danger { background: var(--red-soft); color: var(--red); }
.button-small { min-height: 34px; padding: 0 12px; font-size: 11px; }
.button-plus { font-size: 17px; font-weight: 400; line-height: 1; }
.icon-button { display: grid; width: 34px; aspect-ratio: 1; place-items: center; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; }
.icon-button:hover { background: var(--canvas); color: var(--ink); }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 22px; }
.metric-card { position: relative; min-height: 126px; padding: 18px 19px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.metric-card::after { position: absolute; right: -17px; bottom: -28px; width: 86px; height: 86px; border: 1px solid #e8eee8; border-radius: 50%; content: ""; }
.metric-card.metric-highlight { border-color: var(--green); background: var(--green); color: white; }
.metric-highlight::after { border-color: rgba(255,255,255,.17); }
.metric-label { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; font-weight: 600; }
.metric-highlight .metric-label { color: #c6d9cd; }
.metric-icon { color: var(--green); font-size: 16px; }
.metric-highlight .metric-icon { color: var(--lime); }
.metric-value { margin: 16px 0 4px; font: 800 25px "Inter", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.metric-note { color: var(--muted); font-size: 10px; }
.metric-highlight .metric-note { color: #c6d9cd; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, .9fr); gap: 16px; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel-header h2 { margin: 0; font: 700 14px "Inter", sans-serif; letter-spacing: 0; }
.panel-header p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
.text-link { padding: 4px; border: 0; background: transparent; color: var(--green); cursor: pointer; font-size: 11px; font-weight: 700; }
.text-link:hover { text-decoration: underline; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
th { padding: 11px 18px; background: #fafbf9; color: #858f89; font-size: 9px; font-weight: 700; letter-spacing: .65px; text-transform: uppercase; }
td { padding: 12px 18px; border-top: 1px solid #eef0ec; color: #48534d; font-size: 11px; }
tbody tr:hover { background: #fcfdfb; }
.item-cell { display: flex; align-items: center; gap: 10px; }
.item-avatar { display: grid; flex: 0 0 31px; width: 31px; aspect-ratio: 1; place-items: center; border-radius: 6px; background: var(--green-soft); color: var(--green); font-size: 11px; font-weight: 700; }
.item-avatar.combo-avatar { background: #fbf0df; color: #9c6a24; }
.item-name { display: grid; gap: 3px; }
.item-name strong { color: var(--ink); font-size: 11px; font-weight: 700; }
.item-name small { color: var(--muted); font-size: 9px; }
.mono { color: #76817b; font-size: 10px; font-variant-numeric: tabular-nums; }
.stock-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.stock-low { color: var(--red); }
.pill { display: inline-flex; align-items: center; min-height: 21px; padding: 0 8px; border-radius: 99px; background: var(--green-soft); color: var(--green); font-size: 9px; font-weight: 700; }
.pill.warning { background: var(--amber); color: var(--amber-ink); }
.pill.danger { background: var(--red-soft); color: var(--red); }
.empty-state { padding: 37px 20px; color: var(--muted); text-align: center; }
.empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); font: 700 13px "Inter", sans-serif; }
.empty-state p { margin-bottom: 15px; font-size: 11px; }
.category-list { padding: 4px 17px 12px; }
.category-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 1px; border-bottom: 1px solid #eef0ec; }
.category-row:last-child { border-bottom: 0; }
.category-label { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; }
.category-letter { display: grid; width: 27px; aspect-ratio: 1; place-items: center; border-radius: 6px; background: var(--canvas); color: var(--green); font-size: 10px; font-weight: 700; }
.category-count { color: var(--muted); font-size: 10px; }
.toolbar { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; }
.search-box { position: relative; flex: 1; max-width: 340px; }
.search-box span { position: absolute; top: 50%; left: 12px; color: #8d9791; font-size: 16px; transform: translateY(-52%); }
.field, .select-field { width: 100%; min-height: 39px; padding: 0 11px; border: 1px solid #dfe4dd; border-radius: 5px; background: white; color: var(--ink); font-size: 12px; }
.search-box .field { padding-left: 34px; }
.select-field { width: auto; min-width: 150px; color: #59645d; }
.table-panel { overflow: hidden; }
.table-panel th, .table-panel td { padding-right: 16px; padding-left: 16px; }
.row-actions { display: flex; justify-content: flex-end; gap: 4px; }
.row-action { display: grid; width: 29px; aspect-ratio: 1; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #7d8981; cursor: pointer; font-size: 14px; }
.row-action:hover { background: var(--canvas); color: var(--green); }
.row-action.delete:hover { background: var(--red-soft); color: var(--red); }
.table-footer { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
.category-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.category-card { padding: 17px; border: 1px solid var(--line); border-radius: 7px; background: white; }
.category-card-top { display: flex; align-items: flex-start; justify-content: space-between; }
.category-card-letter { display: grid; width: 39px; aspect-ratio: 1; place-items: center; border-radius: 7px; background: var(--green-soft); color: var(--green); font: 800 15px "Inter", sans-serif; }
.category-card h3 { margin: 17px 0 4px; font: 700 14px "Inter", sans-serif; }
.category-card p { margin: 0; color: var(--muted); font-size: 10px; }
.category-card .row-action { margin: -4px -4px 0 0; }
.sales-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin-bottom: 19px; }
.sale-panel { padding: 20px; }
.sale-panel h2 { margin-bottom: 5px; font: 700 15px "Inter", sans-serif; }
.sale-panel > p { margin-bottom: 19px; color: var(--muted); font-size: 11px; }
.sale-total { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; padding: 12px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.sale-total strong { color: var(--ink); font: 700 15px "Inter", sans-serif; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.form-field { display: grid; gap: 6px; margin-bottom: 13px; }
.form-field label { color: #626e66; font-size: 10px; font-weight: 700; }
.form-field .field, .form-field .select-field { width: 100%; }
.form-hint { margin: -5px 0 12px; color: var(--muted); font-size: 10px; line-height: 1.5; }
.form-error { margin: 0 0 12px; color: var(--red); font-size: 11px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 6px; }
.component-list { display: grid; gap: 8px; margin-bottom: 9px; }
.component-row { display: grid; grid-template-columns: minmax(0, 1fr) 74px 32px; gap: 7px; align-items: center; }
.component-row .field { text-align: center; }
.component-add { margin-bottom: 14px; padding: 7px 0; border: 0; background: transparent; color: var(--green); cursor: pointer; font-size: 11px; font-weight: 700; }
.component-add:hover { text-decoration: underline; }
.history-panel .panel-header { min-height: 59px; }
.history-panel .table-wrap { max-height: 520px; }
.history-panel thead { position: sticky; top: 0; z-index: 1; }
.sale-price { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: rgba(17, 31, 25, .48); animation: fade-in .14s ease both; }
.modal-backdrop[hidden] { display: none; }
.modal { width: min(100%, 510px); max-height: min(90vh, 760px); overflow: auto; border: 1px solid rgba(255,255,255,.5); border-radius: 9px; background: white; box-shadow: var(--shadow); animation: rise-in .18s ease both; }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 21px 23px 17px; border-bottom: 1px solid var(--line); }
.modal-header .eyebrow { margin-bottom: 5px; }
.modal-header h2 { margin: 0; font: 700 18px "Inter", sans-serif; }
.modal-body { padding: 19px 23px 22px; }
.toast { position: fixed; right: 23px; bottom: 23px; z-index: 80; max-width: min(390px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 6px; background: var(--green-dark); color: white; box-shadow: var(--shadow); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(9px); transition: opacity .2s ease, transform .2s ease; }
.toast.visible { opacity: 1; transform: translateY(0); }
.toast.error { background: #8f352e; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

@media (max-width: 1100px) {
  .sidebar { width: 220px; }
  .main-area { margin-left: 220px; }
  .topbar { padding-right: 27px; padding-left: 27px; }
  .page-content { padding-right: 27px; padding-left: 27px; }
  .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .sidebar { width: 248px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .main-area { margin-left: 0; }
  .topbar { height: 58px; padding: 0 16px; }
  .mobile-menu { display: grid; width: 32px; aspect-ratio: 1; place-items: center; border: 0; border-radius: 5px; background: transparent; color: var(--green-dark); cursor: pointer; font-size: 18px; }
  .breadcrumb { margin-right: auto; margin-left: 7px; }
  .topbar-actions { gap: 8px; }
  .today-label { display: none; }
  .topbar .button { min-height: 32px; padding: 0 9px; font-size: 10px; }
  .page-content { padding: 26px 16px 38px; }
  .page-heading { align-items: flex-start; margin-bottom: 21px; }
  h1 { font-size: 24px; }
  .page-heading > .button { flex: 0 0 auto; }
  .dashboard-grid, .sales-grid { grid-template-columns: 1fr; }
  .dashboard-grid { gap: 12px; }
}
@media (max-width: 480px) {
  .metric-grid { gap: 8px; }
  .metric-card { min-height: 112px; padding: 14px; }
  .metric-value { margin-top: 12px; font-size: 21px; }
  .metric-label { font-size: 10px; }
  .toolbar { flex-wrap: wrap; }
  .search-box { flex-basis: 100%; max-width: none; }
  .toolbar .select-field { flex: 1; min-width: 0; }
  .page-heading { gap: 8px; }
  .page-heading .button { padding: 0 9px; font-size: 10px; }
  .form-row { grid-template-columns: 1fr; gap: 0; }
  .modal-backdrop { align-items: end; padding: 0; }
  .modal { width: 100%; max-height: 92vh; border-radius: 11px 11px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

    <script>
class Producto {
  constructor(nombre, categoria, precio, stock, porciones, precioVaso) {
    this.id = "";
    this.nombre = nombre;
    this.categoria = categoria;
    this.precio = precio;
    this.stock = stock;
    this.porciones = porciones;
    this.precioVaso = precioVaso;
    this.vasosSueltos = 0;
  }

  ver() {
    console.log(
      `[${this.id}] ${this.nombre} | ${this.categoria} | ${this.precio} Bs | Stock: ${this.stock} | Vasos sueltos: ${this.vasosSueltos}`
    );
  }

  modificar(nombre, precio, porciones, precioVaso) {
    this.nombre = nombre;
    this.precio = precio;
    this.porciones = porciones;
    this.precioVaso = precioVaso;
  }

  aumentarStock(cantidad) {
    if (cantidad <= 0) {
      console.log("La cantidad debe ser mayor a 0");
      return false;
    }
    this.stock = this.stock + cantidad;
    return true;
  }

  reducirStock(cantidad) {
    if (cantidad <= 0) {
      console.log("La cantidad debe ser mayor a 0");
      return false;
    }
    if (cantidad > this.stock) {
      console.log(`Stock insuficiente de ${this.nombre} (hay ${this.stock})`);
      return false;
    }
    this.stock = this.stock - cantidad;
    return true;
  }

  hayStock() {
    return this.stock > 0 || this.vasosSueltos > 0;
  }

  vasosDisponibles() {
    return this.stock * this.porciones + this.vasosSueltos;
  }

  venderVaso(cantidad) {
    if (this.porciones === 0) {
      console.log(`${this.nombre} no se vende por vaso`);
      return false;
    }
    if (cantidad <= 0) {
      console.log("La cantidad debe ser mayor a 0");
      return false;
    }
    if (cantidad > this.vasosDisponibles()) {
      console.log(
        `Vasos insuficientes de ${this.nombre} (quedan ${this.vasosDisponibles()})`
      );
      return false;
    }
    for (let i = 0; i < cantidad; i++) {
      if (this.vasosSueltos === 0) {
        this.stock = this.stock - 1;
        this.vasosSueltos = this.porciones;
      }
      this.vasosSueltos = this.vasosSueltos - 1;
    }
    return true;
  }

  aFila() {
    return [
      this.id,
      this.nombre,
      this.categoria,
      this.precio,
      this.stock,
      this.porciones,
      this.precioVaso,
      this.vasosSueltos,
    ];
  }
}

class Combo {
  constructor(nombre, precio, componentes) {
    this.id = "";
    this.nombre = nombre;
    this.precio = precio;
    this.componentes = componentes;
  }

  ver() {
    console.log(
      `[${this.id}] ${this.nombre} | ${this.precio} Bs | Disponibles: ${this.disponibles()}`
    );
    this.componentes.forEach((c) => {
      console.log(`    - ${c.cantidad} x ${c.producto.nombre}`);
    });
  }

  modificar(nombre, precio, componentes) {
    this.nombre = nombre;
    this.precio = precio;
    this.componentes = componentes;
  }

  disponibles() {
    if (this.componentes.length === 0) {
      return 0;
    }
    return this.componentes.reduce((menor, c) => {
      let resto = c.producto.stock;
      let veces = 0;
      while (resto >= c.cantidad) {
        resto = resto - c.cantidad;
        veces = veces + 1;
      }
      if (menor === -1 || veces < menor) {
        return veces;
      }
      return menor;
    }, -1);
  }

  vender(cantidad) {
    if (cantidad <= 0) {
      console.log("La cantidad debe ser mayor a 0");
      return false;
    }
    if (cantidad > this.disponibles()) {
      console.log(
        `Combos insuficientes de ${this.nombre} (se pueden armar ${this.disponibles()})`
      );
      return false;
    }
    this.componentes.forEach((c) => {
      c.producto.reducirStock(c.cantidad * cantidad);
    });
    return true;
  }

  aFila() {
    const texto = this.componentes.reduce((acumulado, c) => {
      const parte = `${c.cantidad} x ${c.producto.nombre}`;
      if (acumulado === "") {
        return parte;
      }
      return acumulado + " + " + parte;
    }, "");
    return [this.id, this.nombre, this.precio, texto];
  }
}

class Almacen {
  constructor() {
    this.productos = [];
    this.combos = [];
    this.letraCombos = "K";
    this.ultimoCombo = 0;
    this.categorias = [
      { nombre: "Botellas", letra: "B", ultimo: 0 },
      { nombre: "Cervezas", letra: "C", ultimo: 0 },
      { nombre: "Mezcladores", letra: "M", ultimo: 0 },
      { nombre: "Insumos", letra: "I", ultimo: 0 },
    ];
  }

  agregarCategoria(nombre, letra) {
    if (this.categorias.some((c) => c.nombre === nombre)) {
      console.log(`Ya existe la categoría ${nombre}`);
      return false;
    }
    if (letra.length !== 1) {
      console.log("La letra de la categoría debe ser un solo carácter");
      return false;
    }
    if (letra === this.letraCombos) {
      console.log(`La letra ${letra} está reservada para los combos`);
      return false;
    }
    if (this.categorias.some((c) => c.letra === letra)) {
      console.log(`La letra ${letra} ya la usa otra categoría`);
      return false;
    }
    this.categorias.push({ nombre: nombre, letra: letra, ultimo: 0 });
    return true;
  }

  verCategorias() {
    this.categorias.forEach((c) => {
      const cantidad = this.productos.filter(
        (p) => p.categoria === c.nombre
      ).length;
      console.log(`${c.letra} - ${c.nombre} | Productos: ${cantidad}`);
    });
    console.log(`${this.letraCombos} - Combos | Combos: ${this.combos.length}`);
  }

  agregarProducto(producto) {
    const categoria = this.categorias.find((c) => c.nombre === producto.categoria);
    if (categoria === undefined) {
      console.log(`La categoría ${producto.categoria} no existe en el almacén`);
      return false;
    }
    if (this.productos.some((p) => p === producto)) {
      console.log(`El producto ${producto.nombre} ya fue agregado`);
      return false;
    }
    categoria.ultimo = categoria.ultimo + 1;
    producto.id = categoria.letra + categoria.ultimo;
    this.productos.push(producto);
    return true;
  }

  agregarCombo(combo) {
    if (this.combos.some((c) => c === combo)) {
      console.log(`El combo ${combo.nombre} ya fue agregado`);
      return false;
    }
    const hayNoRegistrados = combo.componentes.some(
      (c) => !this.productos.some((p) => p === c.producto)
    );
    if (hayNoRegistrados) {
      console.log(
        `El combo ${combo.nombre} usa productos que no están en el almacén`
      );
      return false;
    }
    this.ultimoCombo = this.ultimoCombo + 1;
    combo.id = this.letraCombos + this.ultimoCombo;
    this.combos.push(combo);
    return true;
  }

  buscarProducto(id) {
    return this.productos.find((p) => p.id === id);
  }

  buscarCombo(id) {
    return this.combos.find((c) => c.id === id);
  }

  eliminarProducto(id) {
    const posicion = this.productos.findIndex((p) => p.id === id);
    if (posicion === -1) {
      console.log(`No existe un producto con el id ${id}`);
      return false;
    }
    const producto = this.productos[posicion];
    const comboQueLoUsa = this.combos.find((c) =>
      c.componentes.some((k) => k.producto === producto)
    );
    if (comboQueLoUsa !== undefined) {
      console.log(`No se puede eliminar: lo usa el combo ${comboQueLoUsa.nombre}`);
      return false;
    }
    this.productos.splice(posicion, 1);
    return true;
  }

  eliminarCombo(id) {
    const posicion = this.combos.findIndex((c) => c.id === id);
    if (posicion === -1) {
      console.log(`No existe un combo con el id ${id}`);
      return false;
    }
    this.combos.splice(posicion, 1);
    return true;
  }

  verProductos() {
    if (this.productos.length === 0) {
      console.log("No hay productos en el almacén");
    } else {
      this.productos.forEach((p) => p.ver());
    }
  }

  verCombos() {
    if (this.combos.length === 0) {
      console.log("No hay combos registrados");
    } else {
      this.combos.forEach((c) => c.ver());
    }
  }

  filtrarPorCategoria(categoria) {
    return this.productos.filter((p) => p.categoria === categoria);
  }

  stockBajo(limite) {
    return this.productos.filter((p) => p.stock <= limite);
  }

  valorTotal() {
    return this.productos.reduce((total, p) => total + p.precio * p.stock, 0);
  }

  venderVaso(idProducto, cantidad, idVaso) {
    const licor = this.buscarProducto(idProducto);
    const vaso = this.buscarProducto(idVaso);
    if (licor === undefined || vaso === undefined) {
      console.log("El licor o el vaso no existen en el almacén");
      return false;
    }
    if (cantidad <= 0) {
      console.log("La cantidad debe ser mayor a 0");
      return false;
    }
    if (licor.porciones === 0) {
      console.log(`${licor.nombre} no se vende por vaso`);
      return false;
    }
    if (cantidad > licor.vasosDisponibles()) {
      console.log(
        `Vasos de licor insuficientes de ${licor.nombre} (quedan ${licor.vasosDisponibles()})`
      );
      return false;
    }
    if (cantidad > vaso.stock) {
      console.log(`Vasos descartables insuficientes (quedan ${vaso.stock})`);
      return false;
    }
    licor.venderVaso(cantidad);
    vaso.reducirStock(cantidad);
    return true;
  }

  venderCombo(idCombo, cantidad) {
    const combo = this.buscarCombo(idCombo);
    if (combo === undefined) {
      console.log(`No existe un combo con el id ${idCombo}`);
      return false;
    }
    return combo.vender(cantidad);
  }

  aFilasProductos() {
    return this.productos.map((p) => p.aFila());
  }

  aFilasCombos() {
    return this.combos.map((c) => c.aFila());
  }
}

if (typeof module !== "undefined") {
  module.exports = { Producto, Combo, Almacen };
}

    <script>
const STORAGE_KEY = "sis101-almacen-v1";
const LOW_STOCK_LIMIT = 5;
const APPS_SCRIPT_MODE = typeof google !== "undefined" && Boolean(google.script?.run);
const sectionNames = {
  dashboard: "Resumen",
  productos: "Productos",
  combos: "Combos",
  ventas: "Ventas",
  categorias: "Categorías",
};
const currency = new Intl.NumberFormat("es-BO", { style: "currency", currency: "BOB", minimumFractionDigits: 2 });
let almacen = new Almacen();
let salesHistory = [];
let currentView = "dashboard";
let toastTimer;
let sheetVersion = 0;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[character]);
}

function loadData() {
  if (APPS_SCRIPT_MODE) {
    document.getElementById("storage-label").textContent = "Conectando con Google Sheets...";
    google.script.run
      .withSuccessHandler((data) => {
        applySheetData(data);
        document.getElementById("storage-label").textContent = "Conectado a Google Sheets";
        render();
      })
      .withFailureHandler((error) => {
        document.getElementById("storage-label").textContent = "Sin conexión con Google Sheets";
        showToast(`No se pudo cargar la hoja: ${error.message}`, true);
      })
      .apiObtenerDatosWeb();
    return;
  }
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!saved) return;
    almacen.categorias = Array.isArray(saved.categorias) && saved.categorias.length
      ? saved.categorias
      : almacen.categorias;
    almacen.productos = (saved.productos || []).map((data) => {
      const product = new Producto(data.nombre, data.categoria, Number(data.precio), Number(data.stock), Number(data.porciones), Number(data.precioVaso));
      product.id = data.id;
      product.vasosSueltos = Number(data.vasosSueltos || 0);
      return product;
    });
    almacen.ultimoCombo = Number(saved.ultimoCombo || 0);
    almacen.categorias.forEach((category) => { category.ultimo = Number(category.ultimo || 0); });
    almacen.combos = (saved.combos || []).map((data) => {
      const components = data.componentes
        .map((part) => ({ producto: almacen.buscarProducto(part.id), cantidad: Number(part.cantidad) }))
        .filter((part) => part.producto);
      const combo = new Combo(data.nombre, Number(data.precio), components);
      combo.id = data.id;
      combo.componentesRotos = data.componentesRotos || [];
      combo._textoOriginal = data.textoOriginal || null;
      return combo;
    });
    salesHistory = Array.isArray(saved.ventas) ? saved.ventas : [];
  } catch (error) {
    localStorage.removeItem(STORAGE_KEY);
    showToast("No se pudo leer el respaldo local. Se inició un almacén vacío.", true);
  }
}

function saveData() {
  const data = {
    categorias: almacen.categorias,
    productos: almacen.productos.map((product) => ({ ...product })),
    combos: almacen.combos.map((combo) => ({
      id: combo.id,
      nombre: combo.nombre,
      precio: combo.precio,
      componentes: combo.componentes.map((part) => ({ id: part.producto.id, cantidad: part.cantidad })),
      componentesRotos: combo.componentesRotos || [],
      textoOriginal: combo._textoOriginal || null,
    })),
    ultimoCombo: almacen.ultimoCombo,
    ventas: salesHistory,
  };
  if (APPS_SCRIPT_MODE) {
    const inventory = {
      categorias: data.categorias,
      productos: data.productos,
      combos: data.combos,
      ultimoCombo: data.ultimoCombo,
    };
    google.script.run
      .withSuccessHandler((result) => {
        if (!result.ok) {
          if (result.datos) applySheetData(result.datos);
          showToast(result.mensaje || "No se pudo guardar en Google Sheets.", true);
          render();
          return;
        }
        applySheetData(result.datos);
        document.getElementById("storage-label").textContent = "Conectado a Google Sheets";
        render();
      })
      .withFailureHandler((error) => showToast(`Error al guardar en Google Sheets: ${error.message}`, true))
      .apiGuardarInventarioWeb(inventory, sheetVersion);
    updateCounts();
    return;
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateCounts();
}

function applySheetData(data) {
  almacen = new Almacen();
  almacen.categorias = data.categorias || [];
  almacen.productos = (data.productos || []).map((item) => {
    const product = new Producto(item.nombre, item.categoria, Number(item.precio), Number(item.stock), Number(item.porciones), Number(item.precioVaso));
    product.id = item.id;
    product.vasosSueltos = Number(item.vasosSueltos) || 0;
    return product;
  });
  almacen.combos = (data.combos || []).map((item) => {
    const components = item.componentes
      .map((part) => ({ producto: almacen.buscarProducto(part.id), cantidad: Number(part.cantidad) }))
      .filter((part) => part.producto);
    const combo = new Combo(item.nombre, Number(item.precio), components);
    combo.id = item.id;
    combo.componentesRotos = item.componentesRotos || [];
    combo._textoOriginal = item.textoOriginal || null;
    return combo;
  });
  almacen.ultimoCombo = Number(data.ultimoCombo) || 0;
  sheetVersion = String(data.version || "");
  salesHistory = data.ventas || [];
}

function updateCounts() {
  document.getElementById("nav-product-count").textContent = almacen.productos.length;
  document.getElementById("nav-combo-count").textContent = almacen.combos.length;
}

function money(value) {
  return currency.format(Number(value) || 0);
}

function showToast(message, isError = false) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), 2800);
}

function initials(name) {
  return String(name).trim().split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
}

function render() {
  document.getElementById("current-section").textContent = sectionNames[currentView];
  document.querySelectorAll(".nav-item").forEach((item) => item.classList.toggle("active", item.dataset.view === currentView));
  const views = {
    dashboard: renderDashboard,
    productos: renderProducts,
    combos: renderCombos,
    ventas: renderSales,
    categorias: renderCategories,
  };
  document.getElementById("page-content").innerHTML = views[currentView]();
  if (currentView === "ventas") bindSales();
  updateCounts();
}

function pageHeading(eyebrow, title, description, button = "") {
  return `<div class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="page-subtitle">${description}</p></div>${button}</div>`;
}

function productRow(product, actions = false) {
  const stockClass = product.stock <= LOW_STOCK_LIMIT ? "stock-low" : "";
  const stockLabel = product.stock <= 0 ? '<span class="pill danger">Agotado</span>'
    : product.stock <= LOW_STOCK_LIMIT ? '<span class="pill warning">Bajo</span>' : '<span class="pill">Disponible</span>';
  return `<tr>
    <td><div class="item-cell"><span class="item-avatar">${escapeHTML(initials(product.nombre))}</span><span class="item-name"><strong>${escapeHTML(product.nombre)}</strong><small>${escapeHTML(product.categoria)}</small></span></div></td>
    <td class="mono">${escapeHTML(product.id)}</td>
    <td><span class="stock-value ${stockClass}">${product.stock}</span> <span class="mono">unid.</span></td>
    <td>${product.porciones > 0 ? `<span class="mono">${product.vasosDisponibles()} vasos</span>` : '<span class="mono">—</span>'}</td>
    <td>${money(product.precio)}</td><td>${product.porciones}</td><td>${product.porciones > 0 ? money(product.precioVaso) : '<span class="mono">—</span>'}</td><td>${stockLabel}</td>
    ${actions ? `<td><div class="row-actions"><button class="row-action" data-action="edit-product" data-id="${escapeHTML(product.id)}" title="Editar producto" aria-label="Editar ${escapeHTML(product.nombre)}">✎</button><button class="row-action" data-action="add-stock" data-id="${escapeHTML(product.id)}" title="Aumentar stock" aria-label="Aumentar stock de ${escapeHTML(product.nombre)}">＋</button><button class="row-action delete" data-action="delete-product" data-id="${escapeHTML(product.id)}" title="Eliminar producto" aria-label="Eliminar ${escapeHTML(product.nombre)}">×</button></div></td>` : ""}
  </tr>`;
}

function emptyTable(message, detail, action = "", columns = 8) {
  return `<tr><td colspan="${columns}"><div class="empty-state"><strong>${message}</strong><p>${detail}</p>${action}</div></td></tr>`;
}

    const count = almacen.filtrarPorCategoria(category.nombre).length;

      <article class="metric-card"><div class="metric-label">Productos <span class="metric-icon">▤</span></div><div class="metric-value">${almacen.productos.length}</div><div class="metric-note">En ${almacen.categorias.length} categorías</div></article>
      <article class="metric-card"><div class="metric-label">Combos <span class="metric-icon">▦</span></div><div class="metric-value">${almacen.combos.length}</div><div class="metric-note">${almacen.combos.filter((combo) => !combo.componentesRotos?.length && combo.disponibles() > 0).length} con stock disponible</div></article>
      <article class="metric-card"><div class="metric-label">Ventas registradas <span class="metric-icon">↗</span></div><div class="metric-value">${money(totalSales)}</div><div class="metric-note">${salesHistory.length} operaciones guardadas</div></article>

function renderProducts() {
  const rows = almacen.productos.map((product) => productRow(product, true)).join("");

  return `${pageHeading("INVENTARIO", "Productos", "Administra existencias, precios y productos por vaso.", '<button class="button button-primary" data-action="add-product"><span class="button-plus">+</span> Nuevo producto</button>')}
    <div class="toolbar"><label class="search-box"><span>⌕</span><input class="field" id="product-search" type="search" placeholder="Buscar por nombre o ID..."></label><select class="select-field" id="category-filter" aria-label="Filtrar por categoría">${options}</select><button class="button button-secondary button-small" data-action="export-csv">↓ Exportar CSV</button></div>

function renderCombos() {
  const rows = almacen.combos.map((combo) => {
    const broken = combo.componentesRotos?.length > 0;
    const available = broken ? 0 : combo.disponibles();
    const parts = combo.componentes.map((part) => `${part.cantidad} × ${escapeHTML(part.producto.nombre)}`).join(" · ");
    const missing = broken ? ` · Faltan: ${combo.componentesRotos.map(escapeHTML).join(", ")}` : "";
    return `<tr><td><div class="item-cell"><span class="item-avatar combo-avatar">${escapeHTML(initials(combo.nombre))}</span><span class="item-name"><strong>${escapeHTML(combo.nombre)}</strong><small>${parts}${escapeHTML(missing)}</small></span></div></td><td class="mono">${escapeHTML(combo.id)}</td><td>${money(combo.precio)}</td><td><span class="stock-value ${available === 0 ? "stock-low" : ""}">${available}</span></td><td>${broken ? '<span class="pill danger">Componentes faltantes</span>' : available > 0 ? '<span class="pill">Disponible</span>' : '<span class="pill danger">Sin stock</span>'}</td><td><div class="row-actions"><button class="row-action delete" data-action="delete-combo" data-id="${escapeHTML(combo.id)}" title="Eliminar combo" aria-label="Eliminar ${escapeHTML(combo.nombre)}">×</button></div></td></tr>`;
  }).join("");
  return `${pageHeading("CATÁLOGO", "Combos", "Arma paquetes con productos del inventario y controla su disponibilidad.", '<button class="button button-primary" data-action="add-combo"><span class="button-plus">+</span> Nuevo combo</button>')}
    <section class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Combo y componentes</th><th>ID</th><th>Precio</th><th>Disponibles</th><th>Estado</th><th></th></tr></thead><tbody>${rows || emptyTable("Aún no hay combos", "Crea un combo a partir de productos registrados.", '<button class="button button-primary button-small" data-action="add-combo">Crear primer combo</button>', 6)}</tbody></table></div><footer class="table-footer"><span>${almacen.combos.length} combos registrados</span><span>La disponibilidad se calcula con el stock actual</span></footer></section>`;
}

function renderSales() {
  const drinkOptions = almacen.productos.filter((product) => product.porciones > 0).map((product) => `<option value="${escapeHTML(product.id)}">${escapeHTML(product.id)} · ${escapeHTML(product.nombre)} (${product.vasosDisponibles()} vasos)</option>`).join("");

        <div class="form-field"><label for="sale-glass-quantity">Cantidad de vasos</label><input class="field" id="sale-glass-quantity" type="number" min="1" step="1" value="1" required></div>
        <p class="form-hint" id="glass-sale-hint">Selecciona un producto para ver su precio y disponibilidad.</p><div class="sale-total"><span>Total estimado</span><strong id="glass-sale-total">${money(0)}</strong></div><button class="button button-primary" type="submit">Registrar venta</button>
      </form>

function renderCategories() {

    <div class="category-cards">${cards}</div>`;
}

function openModal(title, content, eyebrow = "ALMACÉN") {
  document.getElementById("modal-eyebrow").textContent = eyebrow;
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = content;
  document.getElementById("modal-backdrop").hidden = false;
  document.body.style.overflow = "hidden";
  const firstInput = document.querySelector("#modal-body input, #modal-body select");
  if (firstInput) firstInput.focus();
}

function closeModal() {
  document.getElementById("modal-backdrop").hidden = true;
  document.body.style.overflow = "";
}

function productForm(product = null) {
  if (almacen.categorias.length === 0) {
    showToast("Primero crea una categoría para agregar productos.", true);
    return;
  }
  const editing = Boolean(product);
  const categoryOptions = almacen.categorias.map((category) => `<option value="${escapeHTML(category.nombre)}" ${product?.categoria === category.nombre ? "selected" : ""}>${escapeHTML(category.nombre)}</option>`).join("");
  openModal(editing ? "Editar producto" : "Nuevo producto", `<form id="product-form">
    <div class="form-field"><label for="product-name">Nombre</label><input class="field" id="product-name" name="nombre" maxlength="70" value="${escapeHTML(product?.nombre || "")}" placeholder="Ej. Singani Casa Real" required></div>
    <div class="form-row"><div class="form-field"><label for="product-category">Categoría</label><select class="select-field" id="product-category" name="categoria" ${editing ? "disabled" : ""}>${categoryOptions}</select></div><div class="form-field"><label for="product-price">Precio (Bs)</label><input class="field" id="product-price" name="precio" type="number" min="0" step="0.01" value="${product?.precio ?? ""}" required></div></div>
    <div class="form-row"><div class="form-field"><label for="product-stock">Stock actual</label><input class="field" id="product-stock" name="stock" type="number" min="0" step="1" value="${product?.stock ?? 0}" required></div><div class="form-field"><label for="product-portions">Porciones por unidad</label><input class="field" id="product-portions" name="porciones" type="number" min="0" step="1" value="${product?.porciones ?? 0}" required></div></div>
    <div class="form-field"><label for="product-glass-price">Precio por vaso (Bs)</label><input class="field" id="product-glass-price" name="precioVaso" type="number" min="0" step="0.01" value="${product?.precioVaso ?? 0}" required></div>
    ${editing ? `<p class="form-hint">ID ${escapeHTML(product.id)} · La categoría y el ID no se modifican.</p>` : '<p class="form-hint">El ID se asigna automáticamente según el prefijo de categoría.</p>'}
    <div class="form-actions"><button class="button button-secondary" type="button" data-action="close-modal">Cancelar</button><button class="button button-primary" type="submit">${editing ? "Guardar cambios" : "Crear producto"}</button></div>
  </form>`);
  document.getElementById("product-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    const nombre = String(form.get("nombre")).trim();
    const precio = Number(form.get("precio"));
    const stock = Number(form.get("stock"));
    const porciones = Number(form.get("porciones"));
    const precioVaso = Number(form.get("precioVaso"));
    if (!nombre || [precio, stock, porciones, precioVaso].some((value) => !Number.isFinite(value) || value < 0)) {
      showToast("Revisa los datos: deben ser valores válidos y no negativos.", true);
      return;
    }
    if (editing) {
      product.modificar(nombre, precio, porciones, precioVaso);
      product.stock = stock;
      product.vasosSueltos = Math.min(product.vasosSueltos, porciones || 0);
      showToast("Producto actualizado.");
    } else {
      const duplicate = almacen.productos.some((item) => item.nombre.toLowerCase() === nombre.toLowerCase());
      if (duplicate) return showToast("Ya existe un producto con ese nombre.", true);
      const created = new Producto(nombre, form.get("categoria"), precio, stock, porciones, precioVaso);
      if (!almacen.agregarProducto(created)) return showToast("No se pudo crear el producto.", true);
      showToast(`Producto ${created.id} agregado.`);
    }
    saveData(); closeModal(); render();
  });
}

function addStockForm(product) {
  openModal("Aumentar stock", `<form id="stock-form"><p class="form-hint">${escapeHTML(product.nombre)} · ${escapeHTML(product.id)} · Stock actual: ${product.stock}</p><div class="form-field"><label for="stock-quantity">Unidades a agregar</label><input class="field" id="stock-quantity" type="number" min="1" step="1" value="1" required></div><div class="form-actions"><button class="button button-secondary" type="button" data-action="close-modal">Cancelar</button><button class="button button-primary" type="submit">Actualizar stock</button></div></form>`);
  document.getElementById("stock-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const quantity = Number(document.getElementById("stock-quantity").value);
    if (!product.aumentarStock(quantity)) return showToast("La cantidad debe ser mayor a cero.", true);
    saveData(); closeModal(); render(); showToast("Stock actualizado.");
  });
}

function comboForm() {
  if (almacen.productos.length === 0) return showToast("Agrega productos antes de crear un combo.", true);
  openModal("Nuevo combo", `<form id="combo-form"><div class="form-field"><label for="combo-name">Nombre del combo</label><input class="field" id="combo-name" maxlength="70" placeholder="Ej. Combo de la casa" required></div><div class="form-field"><label for="combo-price">Precio del combo (Bs)</label><input class="field" id="combo-price" type="number" min="0" step="0.01" value="0" required></div><div class="form-field"><label>Componentes</label><div class="component-list" id="component-list"></div><button class="component-add" type="button" id="add-component">+ Añadir componente</button></div><p class="form-hint">Cada producto solo puede aparecer una vez. Los combos disponibles dependen del stock actual.</p><div class="form-actions"><button class="button button-secondary" type="button" data-action="close-modal">Cancelar</button><button class="button button-primary" type="submit">Crear combo</button></div></form>`);
  const componentList = document.getElementById("component-list");
  const addComponent = () => {
    const usedIds = [...componentList.querySelectorAll("select")].map((select) => select.value);
    const available = almacen.productos.filter((product) => !usedIds.includes(product.id));
    if (!available.length) return showToast("Ya agregaste todos los productos disponibles.", true);
    const row = document.createElement("div");
    row.className = "component-row";
    row.innerHTML = `<select class="select-field" required>${available.map((product) => `<option value="${escapeHTML(product.id)}">${escapeHTML(product.id)} · ${escapeHTML(product.nombre)}</option>`).join("")}</select><input class="field" type="number" min="1" step="1" value="1" aria-label="Cantidad" required><button class="row-action delete" type="button" aria-label="Quitar componente">×</button>`;
    row.querySelector("button").addEventListener("click", () => row.remove());
    componentList.appendChild(row);
  };
  document.getElementById("add-component").addEventListener("click", addComponent);
  addComponent();
  document.getElementById("combo-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const nombre = document.getElementById("combo-name").value.trim();
    const precio = Number(document.getElementById("combo-price").value);
    const components = [...componentList.querySelectorAll(".component-row")].map((row) => ({ producto: almacen.buscarProducto(row.querySelector("select").value), cantidad: Number(row.querySelector("input").value) }));
    if (!nombre || !Number.isFinite(precio) || precio < 0 || !components.length || components.some((part) => !part.producto || part.cantidad < 1)) return showToast("Completa el nombre, precio y componentes válidos.", true);
    if (almacen.combos.some((combo) => combo.nombre.toLowerCase() === nombre.toLowerCase())) return showToast("Ya existe un combo con ese nombre.", true);
    const combo = new Combo(nombre, precio, components);
    if (!almacen.agregarCombo(combo)) return showToast("No se pudo crear el combo.", true);
    saveData(); closeModal(); render(); showToast(`Combo ${combo.id} creado.`);
  });
}

function categoryForm() {
  openModal("Nueva categoría", `<form id="category-form"><div class="form-field"><label for="category-name">Nombre</label><input class="field" id="category-name" maxlength="35" placeholder="Ej. Snacks" required></div><div class="form-field"><label for="category-letter">Prefijo del ID</label><input class="field" id="category-letter" maxlength="1" pattern="[A-Za-z]" placeholder="S" required></div><p class="form-hint">Usa una letra única. La K está reservada para los combos.</p><div class="form-actions"><button class="button button-secondary" type="button" data-action="close-modal">Cancelar</button><button class="button button-primary" type="submit">Crear categoría</button></div></form>`);
  document.getElementById("category-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const name = document.getElementById("category-name").value.trim();
    const letter = document.getElementById("category-letter").value.trim().toUpperCase();
    if (!name || !/^[A-Z]$/.test(letter)) return showToast("Escribe un nombre y una sola letra para el prefijo.", true);
    if (!almacen.agregarCategoria(name, letter)) return showToast("El nombre o prefijo ya existe, o la letra K está reservada.", true);
    saveData(); closeModal(); render(); showToast("Categoría agregada.");
  });
}

function confirmAction(title, detail, confirmLabel, action, danger = false) {
  openModal(title, `<p class="form-hint">${detail}</p><div class="form-actions"><button class="button button-secondary" type="button" data-action="close-modal">Cancelar</button><button class="button ${danger ? "button-danger" : "button-primary"}" type="button" id="confirm-action">${confirmLabel}</button></div>`);
  document.getElementById("confirm-action").addEventListener("click", () => {
    const result = action();
    if (!result.ok) return showToast(result.message, true);
    closeModal(); saveData(); render(); showToast(result.message);
  });
}

function recordSale(type, detail, quantity, total) {
  salesHistory.unshift({ tipo: type, detalle: detail, cantidad: quantity, total, fecha: new Date().toLocaleString("es-BO", { dateStyle: "short", timeStyle: "short" }) });
  saveData(); render(); showToast("Venta registrada y stock actualizado.");
}

function executeSheetSale(method, submitButton, ...args) {
  submitButton.disabled = true;
  google.script.run
    .withSuccessHandler((result) => {
      submitButton.disabled = false;
      if (!result.ok) return showToast(result.mensaje, true);
      applySheetData(result.datos);
      render();
      showToast(result.mensaje);
    })
    .withFailureHandler((error) => {
      submitButton.disabled = false;
      showToast(`No se pudo registrar la venta: ${error.message}`, true);
    })[method](...args);
}

function bindSales() {
  const drinkSelect = document.getElementById("sale-drink");
  const cupSelect = document.getElementById("sale-cup");
  const drinkQuantity = document.getElementById("sale-glass-quantity");
  const updateGlassEstimate = () => {
    const drink = almacen.buscarProducto(drinkSelect.value);
    const quantity = Number(drinkQuantity.value) || 0;
    document.getElementById("glass-sale-total").textContent = money((drink?.precioVaso || 0) * quantity);
    document.getElementById("glass-sale-hint").textContent = drink
      ? `${drink.vasosDisponibles()} vasos disponibles · ${money(drink.precioVaso)} por vaso · ${almacen.buscarProducto(cupSelect.value)?.stock || 0} vasos descartables`
      : "Selecciona un producto para ver su precio y disponibilidad.";
  };
  [drinkSelect, cupSelect, drinkQuantity].forEach((element) => element.addEventListener("input", updateGlassEstimate));
  updateGlassEstimate();
  document.getElementById("glass-sale-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const drink = almacen.buscarProducto(drinkSelect.value);
    const quantity = Number(drinkQuantity.value);
    const cup = almacen.buscarProducto(cupSelect.value);
    if (!drink || !cup || !Number.isInteger(quantity) || quantity <= 0) return showToast("Selecciona productos y una cantidad válida.", true);
    if (APPS_SCRIPT_MODE) return executeSheetSale("apiVenderVasoWeb", event.submitter, drink.id, cup.id, quantity);
    if (!almacen.venderVaso(drink.id, quantity, cup.id)) return showToast("No hay stock suficiente para completar la venta.", true);
    recordSale("vaso", `${drink.nombre} · ${cup.nombre}`, quantity, drink.precioVaso * quantity);
  });

  const comboSelect = document.getElementById("sale-combo");
  const comboQuantity = document.getElementById("sale-combo-quantity");
  const updateComboEstimate = () => {
    const combo = almacen.buscarCombo(comboSelect.value);
    const quantity = Number(comboQuantity.value) || 0;
    document.getElementById("combo-sale-total").textContent = money((combo?.precio || 0) * quantity);
    document.getElementById("combo-sale-hint").textContent = combo
      ? `${combo.disponibles()} combos disponibles · ${money(combo.precio)} por combo`
      : "Selecciona un combo para ver disponibilidad.";
  };
  [comboSelect, comboQuantity].forEach((element) => element.addEventListener("input", updateComboEstimate));
  updateComboEstimate();
  document.getElementById("combo-sale-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const combo = almacen.buscarCombo(comboSelect.value);
    const quantity = Number(comboQuantity.value);
    if (!combo || !Number.isInteger(quantity) || quantity <= 0) return showToast("Selecciona un combo y una cantidad válida.", true);
    const total = combo.precio * quantity;
    if (APPS_SCRIPT_MODE) return executeSheetSale("apiVenderComboWeb", event.submitter, combo.id, quantity);
    if (!almacen.venderCombo(combo.id, quantity)) return showToast("No hay stock suficiente para completar la venta.", true);
    recordSale("combo", combo.nombre, quantity, total);
  });
}

function exportBackup() {
  const data = JSON.stringify({
    categorias: almacen.categorias,
    productos: almacen.productos.map((product) => ({ ...product })),
    combos: almacen.combos.map((combo) => ({
      id: combo.id,
      nombre: combo.nombre,
      precio: combo.precio,
      componentes: combo.componentes.map((part) => ({ id: part.producto.id, cantidad: part.cantidad })),
    })),
    ventas: salesHistory,
  }, null, 2);
  downloadFile(`respaldo-almacen-${new Date().toISOString().slice(0, 10)}.json`, data, "application/json");
  showToast("Respaldo descargado.");
}

function downloadFile(filename, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
}

function exportProductsCSV() {
  const rows = [["ID", "Nombre", "Categoría", "Precio", "Stock", "Porciones", "Precio vaso", "Vasos sueltos"], ...almacen.aFilasProductos()];
  const csv = rows.map((row) => row.map((value) => `"${String(value ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  downloadFile("productos-almacen.csv", `\uFEFF${csv}`, "text/csv;charset=utf-8");
  showToast("Inventario exportado a CSV.");
}

document.addEventListener("click", (event) => {
  const viewButton = event.target.closest("[data-view]");
  if (viewButton) {
    currentView = viewButton.dataset.view;
    render();
    document.getElementById("sidebar").classList.remove("open");
    return;
  }
  const actionButton = event.target.closest("[data-action]");
  if (!actionButton) return;
  const { action, id, name } = actionButton.dataset;
  if (action === "add-product") productForm();
  if (action === "edit-product") productForm(almacen.buscarProducto(id));
  if (action === "add-stock") addStockForm(almacen.buscarProducto(id));
  if (action === "add-combo") comboForm();
  if (action === "add-category") categoryForm();
  if (action === "close-modal") closeModal();
  if (action === "export-data") exportBackup();
  if (action === "export-csv") exportProductsCSV();
  if (action === "delete-product") {
    const product = almacen.buscarProducto(id);
    const combo = almacen.combos.find((item) => item.componentes.some((part) => part.producto.id === id));
    if (combo) return showToast(`No se puede eliminar: ${product.nombre} forma parte de ${combo.nombre}.`, true);
    confirmAction("Eliminar producto", `Se eliminará <strong>${escapeHTML(product.nombre)}</strong> (${escapeHTML(id)}). Esta acción no se puede deshacer.`, "Eliminar producto", () => ({ ok: almacen.eliminarProducto(id), message: "Producto eliminado." }), true);
  }
  if (action === "delete-combo") {
    const combo = almacen.buscarCombo(id);
    confirmAction("Eliminar combo", `Se eliminará <strong>${escapeHTML(combo.nombre)}</strong> (${escapeHTML(id)}).`, "Eliminar combo", () => ({ ok: almacen.eliminarCombo(id), message: "Combo eliminado." }), true);
  }
  if (action === "delete-category") {
    const category = almacen.categorias.find((item) => item.nombre === name);
    const used = almacen.productos.some((product) => product.categoria === name);
    if (used) return showToast("No se puede eliminar una categoría que contiene productos.", true);
    confirmAction("Eliminar categoría", `Se eliminará la categoría <strong>${escapeHTML(name)}</strong>.`, "Eliminar categoría", () => {
      const index = almacen.categorias.findIndex((item) => item.nombre === name);
      if (index < 0) return { ok: false, message: "La categoría ya no existe." };
      almacen.categorias.splice(index, 1);
      return { ok: true, message: "Categoría eliminada." };
    }, true);
  }
});

document.getElementById("page-content").addEventListener("input", (event) => {
  if (event.target.id !== "product-search" && event.target.id !== "category-filter") return;
  const search = (document.getElementById("product-search")?.value || "").trim().toLowerCase();
  const category = document.getElementById("category-filter")?.value || "";
  const filtered = almacen.productos.filter((product) =>
    (!category || product.categoria === category)
    && (!search || `${product.nombre} ${product.id} ${product.categoria}`.toLowerCase().includes(search)));
  document.getElementById("product-rows").innerHTML = filtered.map((product) => productRow(product, true)).join("") || emptyTable("Sin resultados", "Prueba con otro nombre, ID o categoría.", "", 9);
  document.getElementById("product-result-count").textContent = `${filtered.length} ${filtered.length === 1 ? "producto" : "productos"}`;
});

document.getElementById("page-content").addEventListener("change", (event) => {
  if (event.target.id === "category-filter") event.target.dispatchEvent(new Event("input", { bubbles: true }));
});

document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-backdrop").addEventListener("click", (event) => {
  if (event.target.id === "modal-backdrop") closeModal();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !document.getElementById("modal-backdrop").hidden) closeModal();
});
document.getElementById("mobile-menu").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("export-data").addEventListener("click", exportBackup);

const now = new Date();
document.getElementById("today-label").textContent = new Intl.DateTimeFormat("es-BO", { weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(now);
if (APPS_SCRIPT_MODE) {
  document.getElementById("storage-label").textContent = "Conectando con Google Sheets...";
  loadData();
  render();
} else {
  loadData();
  saveData();
  render();
}
