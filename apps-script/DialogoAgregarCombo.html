<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
  <style>
    .fila-componente {
      display: grid;
      grid-template-columns: 1fr 75px 36px;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    .fila-componente select { width: 100%; padding: 7px 8px; }
    .fila-componente input { width: 100%; padding: 7px 8px; text-align: center; }
    .btn-eliminar {
      background: #fce8e6;
      color: #c5221f;
      border: none;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .btn-eliminar:hover { background: #f4c7c3; }
    .btn-anadir {
      background: #e8f0fe;
      color: #1a73e8;
      border: 1px dashed #1a73e8;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      margin-top: 4px;
    }
    .btn-anadir:hover { background: #d2e3fc; }
    .disponibles {
      font-size: 18px;
      font-weight: bold;
      color: #137333;
      margin-top: 4px;
    }
    .disponibles.bajo { color: #c5221f; }
  </style>
</head>
<body>
  <h2>Agregar Combo</h2>

  <div class="campo">
    <label for="nombre">Nombre del combo</label>
    <input type="text" id="nombre" maxlength="70" placeholder="Ej: Combo Mojito" oninput="actualizar()">
  </div>

  <div class="campo">
    <label for="precio">Precio (Bs)</label>
    <input type="number" id="precio" min="0" step="0.01" value="0" oninput="actualizar()">
  </div>

  <div class="campo">
    <label>Componentes</label>
    <div id="componentes"></div>
    <button type="button" class="btn-anadir" onclick="agregarFila()">+ Añadir componente</button>
  </div>

  <div class="info" id="info">Cargando productos...</div>
  <div class="mensaje" id="mensaje"></div>

  <div class="botones">
    <button class="btn-cancelar" onclick="google.script.host.close()">Cancelar</button>
    <button class="btn-primario" id="btnGuardar" onclick="guardar()" disabled>Guardar Combo</button>
  </div>

  <script>
    let productos = [];
    let nombresExistentes = [];

    google.script.run
      .withSuccessHandler(function(datos) {
        productos = datos.productos;
        nombresExistentes = datos.nombresExistentes;
        agregarFila();
        actualizar();
      })
      .withFailureHandler(function(err) {
        document.getElementById('info').textContent = 'Error al cargar: ' + err.message;
      })
      .getDatosParaAgregarCombo();

    function agregarFila() {
      const cont = document.getElementById('componentes');
      const fila = document.createElement('div');
      fila.className = 'fila-componente';
      fila.innerHTML = `
        <select required onchange="actualizar()"></select>
        <input type="number" min="1" step="1" value="1" oninput="actualizar()" required>
        <button type="button" class="btn-eliminar" onclick="eliminarFila(this)">×</button>
      `;
      cont.appendChild(fila);
      refrescarDesplegables();
      actualizar();
    }

    function eliminarFila(btn) {
      const cont = document.getElementById('componentes');
      if (cont.children.length <= 1) return;
      btn.parentElement.remove();
      refrescarDesplegables();
      actualizar();
    }

    function refrescarDesplegables() {
      const filas = document.querySelectorAll('.fila-componente');
      filas.forEach((fila, idx) => {
        const sel = fila.querySelector('select');
        const valorActual = sel.value;
        const yaElegidos = [];
        filas.forEach((otra, j) => {
          if (j !== idx) {
            const v = otra.querySelector('select').value;
            if (v) yaElegidos.push(v);
          }
        });
        const disponibles = productos.filter(p => !yaElegidos.includes(p.id));
        sel.innerHTML = disponibles.length
          ? disponibles.map(p => `<option value="${p.id}">${p.id} - ${p.nombre} (stock: ${p.stock})</option>`).join('')
          : '<option value="">Sin productos disponibles</option>';
        if (disponibles.some(p => p.id === valorActual)) sel.value = valorActual;
      });
    }

    function calcularDisponibles(componentes) {
      if (componentes.length === 0) return 0;
      return componentes.reduce((menor, c) => {
        const veces = Math.floor(c.producto.stock / c.cantidad);
        return (menor === -1 || veces < menor) ? veces : menor;
      }, -1);
    }

    function obtenerComponentes() {
      return Array.from(document.querySelectorAll('.fila-componente')).map(fila => ({
        id: fila.querySelector('select').value,
        cantidad: Number(fila.querySelector('input').value)
      }));
    }

    function actualizar() {
      const nombre = document.getElementById('nombre').value.trim();
      const precio = Number(document.getElementById('precio').value);
      const componentes = obtenerComponentes();
      const info = document.getElementById('info');
      const btn = document.getElementById('btnGuardar');

      if (productos.length === 0) {
        info.textContent = 'No hay productos en el almacén. Agrega productos primero.';
        btn.disabled = true;
        return;
      }

      if (componentes.length === 0 || componentes.some(c => !c.id || !Number.isInteger(c.cantidad) || c.cantidad <= 0)) {
        info.textContent = 'Selecciona un producto y una cantidad entera mayor a 0 para cada componente.';
        btn.disabled = true;
        return;
      }

      const ids = componentes.map(c => c.id);
      if (ids.length !== new Set(ids).size) {
        info.innerHTML = '<span style="color:#c5221f">Hay productos repetidos. Cada producto debe aparecer una sola vez.</span>';
        btn.disabled = true;
        return;
      }

      const componentesConProducto = componentes.map(c => ({
        producto: productos.find(p => p.id === c.id),
        cantidad: c.cantidad
      }));
      if (componentesConProducto.some(c => !c.producto)) {
        info.textContent = 'Uno de los productos seleccionados ya no está disponible.';
        btn.disabled = true;
        return;
      }

      const disponibles = calcularDisponibles(componentesConProducto);
      const claseDisponibles = disponibles <= 0 ? 'bajo' : '';
      let html = `<div>Combos que se pueden armar: <span class="disponibles ${claseDisponibles}">${disponibles}</span></div>`;
      if (disponibles <= 0) {
        html += '<div style="color:#c5221f;font-size:12px;margin-top:4px">No hay stock suficiente para armar al menos 1 combo.</div>';
      }

      const nombreDuplicado = nombresExistentes.some(combo =>
        combo.nombre.toLowerCase() === nombre.toLowerCase()
      );
      if (nombre && nombreDuplicado) {
        html += '<div style="color:#c5221f;font-size:12px;margin-top:4px">Ya existe un combo con ese nombre.</div>';
      }

      info.innerHTML = html;
      btn.disabled = !(nombre.length > 0 && Number.isFinite(precio) && precio >= 0 && !nombreDuplicado && disponibles > 0);
    }

    function guardar() {
      const nombre = document.getElementById('nombre').value.trim();
      const precio = Number(document.getElementById('precio').value);
      const componentes = obtenerComponentes();
      const btn = document.getElementById('btnGuardar');
      const msg = document.getElementById('mensaje');
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      msg.className = 'mensaje';
      msg.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(res) {
          msg.textContent = res.mensaje;
          msg.className = 'mensaje ' + (res.ok ? 'exito' : 'error');
          if (res.ok) setTimeout(() => google.script.host.close(), 1500);
          else { btn.disabled = false; btn.textContent = 'Guardar Combo'; }
        })
        .withFailureHandler(function(err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'mensaje error';
          btn.disabled = false;
          btn.textContent = 'Guardar Combo';
        })
        .ejecutarAgregarComboDesdeDialogo(nombre, precio, componentes);
    }
  </script>
</body>
</html>
