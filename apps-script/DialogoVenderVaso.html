<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Estilos') ?>
</head>
<body>
  <h2>Vender Vaso</h2>
  <div class="campo">
    <label for="licor">Licor</label>
    <select id="licor" onchange="actualizar()"><option>Cargando...</option></select>
  </div>
  <div class="campo">
    <label for="vaso">Vaso descartable</label>
    <select id="vaso"><option>Cargando...</option></select>
  </div>
  <div class="campo">
    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" value="1" min="1" onchange="actualizar()" oninput="actualizar()">
  </div>
  <div class="info" id="info">Cargando datos...</div>
  <div class="mensaje" id="mensaje"></div>
  <div class="botones">
    <button class="btn-cancelar" onclick="google.script.host.close()">Cancelar</button>
    <button class="btn-primario" id="btnVender" onclick="vender()" disabled>Vender</button>
  </div>
  <script>
    let licores = [];
    let vasos = [];

    google.script.run
      .withSuccessHandler(function(datos) {
        licores = datos.licores;
        vasos = datos.vasos;
        document.getElementById('licor').innerHTML = licores.length
          ? licores.map(l => `<option value="${l.id}">${l.id} - ${l.nombre} (${l.precioVaso} Bs/vaso)</option>`).join('')
          : '<option value="">No hay licores con vasos disponibles</option>';
        document.getElementById('vaso').innerHTML = vasos.length
          ? vasos.map(v => `<option value="${v.id}">${v.id} - ${v.nombre} (stock: ${v.stock})</option>`).join('')
          : '<option value="">No hay productos con stock</option>';
        actualizar();
      })
      .withFailureHandler(function(err) {
        document.getElementById('info').textContent = 'Error al cargar: ' + err.message;
      })
      .getDatosParaVenderVaso();

    function actualizar() {
      const idLicor = document.getElementById('licor').value;
      const cantidad = parseInt(document.getElementById('cantidad').value) || 0;
      const licor = licores.find(l => l.id === idLicor);
      const info = document.getElementById('info');
      const btn = document.getElementById('btnVender');
      if (!licor || cantidad <= 0) {
        info.textContent = 'Selecciona licor y una cantidad válida.';
        btn.disabled = true;
        return;
      }
      const total = cantidad * licor.precioVaso;
      let html = `Vasos disponibles: <strong>${licor.vasosDisponibles}</strong><br>Total a cobrar: <strong>${total} Bs</strong>`;
      if (cantidad > licor.vasosDisponibles) {
        html += `<br><span style="color:#c5221f">Stock insuficiente (solo hay ${licor.vasosDisponibles}).</span>`;
        btn.disabled = true;
      } else {
        btn.disabled = false;
      }
      info.innerHTML = html;
    }

    function vender() {
      const idLicor = document.getElementById('licor').value;
      const idVaso = document.getElementById('vaso').value;
      const cantidad = parseInt(document.getElementById('cantidad').value);
      const btn = document.getElementById('btnVender');
      const msg = document.getElementById('mensaje');
      btn.disabled = true;
      btn.textContent = 'Vendiendo...';
      msg.className = 'mensaje';
      msg.style.display = 'none';
      google.script.run
        .withSuccessHandler(function(res) {
          msg.textContent = res.mensaje;
          msg.className = 'mensaje ' + (res.ok ? 'exito' : 'error');
          if (res.ok) {
            setTimeout(() => google.script.host.close(), 1500);
          } else {
            btn.disabled = false;
            btn.textContent = 'Vender';
          }
        })
        .withFailureHandler(function(err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'mensaje error';
          btn.disabled = false;
          btn.textContent = 'Vender';
        })
        .ejecutarVentaVasoDesdeDialogo(idLicor, idVaso, cantidad);
    }
  </script>
</body>
</html>
