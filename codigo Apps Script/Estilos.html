<style>
  * { box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
  body { margin: 0; padding: 20px; background: #f8f9fa; color: #202124; font-size: 14px; }
  h2 { margin: 0 0 18px 0; font-size: 18px; color: #1a73e8; }
  .campo { margin-bottom: 14px; }
  label { display: block; font-weight: 500; margin-bottom: 4px; color: #3c4043; font-size: 13px; }
  select, input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; background: #fff; }
  select:focus, input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
  .info { background: #e8f0fe; padding: 10px 12px; border-radius: 6px; margin: 14px 0; font-size: 13px; color: #1967d2; min-height: 44px; }
  .info strong { color: #174ea6; }
  .botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  button { padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-cancelar { background: #f1f3f4; color: #3c4043; }
  .btn-cancelar:hover { background: #e8eaed; }
  .btn-primario { background: #1a73e8; color: #fff; }
  .btn-primario:hover:not(:disabled) { background: #1765cc; }
  .mensaje { padding: 10px 12px; border-radius: 6px; margin-top: 12px; font-size: 13px; display: none; }
  .mensaje.exito { background: #e6f4ea; color: #137333; display: block; }
  .mensaje.error { background: #fce8e6; color: #c5221f; display: block; }
</style>
